[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-adb-backup"
version = "2.1.0"
description = "Cross-platform, non-destructive, resumable Android backup utility with beautiful terminal UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "MohammadHossein Asadi", email = "mohammadhossein.asadi@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7",
    "click>=8.1",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "tomli>=2.0; python_version<'3.11'",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pyinstaller>=6.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.entry-points.console_scripts]
android-backup = "android_backup.__main__:main"

[project.urls]
Homepage = "https://github.com/mohammadhossein-asadi/Android-ADB-Backup"
Repository = "https://github.com/mohammadhossein-asadi/Android-ADB-Backup"
Issues = "https://github.com/mohammadhossein-asadi/Android-ADB-Backup/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["android_backup*"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/android_backup"]
branch = true